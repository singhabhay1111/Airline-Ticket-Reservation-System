<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Passenger Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #1e3c72;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary {
            background: #1e3c72;
            color: white;
        }

        .btn-primary:hover {
            background: #16325c;
        }

        .btn-secondary {
            background: #ccc;
        }

        .btn-secondary:hover {
            background: #aaa;
        }
    </style>

</head>

<body>

<div class="container">
    <h1>✈ Passenger Details</h1>

    <input type="text" id="name" placeholder="Full Name">
    <input type="number" id="age" placeholder="Age">

    <br>

    <button class="btn-primary" onclick="bookTicket()">Confirm Booking</button>
    <br>
    <button class="btn-secondary" onclick="goHome()">🏠 Home</button>
    <button class="btn-secondary" onclick="goBack()">⬅ Back</button>
</div>

<script>
    function bookTicket() {
        const name = document.getElementById("name").value;
        const age = document.getElementById("age").value;

        if (!name || !age) {
            alert("Please fill all details!");
            return;
        }

        alert("Booking Confirmed for " + name);
    }

    function goHome() {
        window.location.href = "index.html";
    }

    function goBack() {
        window.history.back();
    }
</script>

</body>
</html>
